name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  integration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config

  security:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit
        run: |
          corepack enable
          pnpm audit --prod || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

  images:
    runs-on: ubuntu-26.04
    needs: [quality, integration, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build api worker web
      - name: Container scan (placeholder)
        run: echo "Add Trivy or Grype scanning in production hardening phase"
